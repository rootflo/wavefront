<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Wavefront by Rootflo — build, deploy and manage AI agents, workflows and voice agents." />
  <meta name="application-name" content="Wavefront" />
  <meta name="apple-mobile-web-app-title" content="Wavefront" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wavefront" />
  <meta property="og:title" content="Wavefront Console | Rootflo" />
  <meta property="og:description" content="Build, deploy and manage AI agents, workflows and voice agents." />
  <meta property="og:image" content="/wavefront.png" />
  <meta name="twitter:card" content="summary" />
  <script src="/config.js"></script>
  <meta name="theme-color" content="#f6fafd" />
  <script>
    // Apply the saved theme before first paint to avoid a flash; mirrors src/store/theme-store.ts.
    (function () {
      try {
        var pref = localStorage.getItem('wavefront-theme-preference');
        if (pref !== 'light' && pref !== 'dark') pref = 'system';
        var theme =
          pref === 'system'
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : pref;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0b1220' : '#f6fafd');
      } catch (e) { }
    })();
  </script>
  <title>Wavefront Console | Rootflo</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
