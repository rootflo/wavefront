[cloud]
platform = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION:}
project_id = ${CLOUD_PROJECT_ID:}

[database]
username = ${CONSOLE_DB_USERNAME}
password = ${CONSOLE_DB_PASSWORD}
host = ${CONSOLE_DB_HOST}
port = ${CONSOLE_DB_PORT}
db_name = ${CONSOLE_DB_NAME}

[deployment]
build_trigger_url=${BUILD_TRIGGER_URL:}

[env_config]
app_env = ${APP_ENV:production}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}
worker_count = ${FLOCONSOLE_WORKER_COUNT:1}
uvicorn_log_level = ${FLOCONSOLE_UVICORN_LOG_LEVEL:critical}

[jwt_token]
token_expiry=${TOKEN_EXPIRY:3600}
temporary_token_expiry=${TEMPORARY_TOKEN_EXPIRY:300}
token_prefix=${CONSOLE_TOKEN_PREFIX:fc_}
issuer=${CONSOLE_JWT_ISSUER:https://console.rootflo.ai}
audience=${CONSOLE_JWT_AUDIENCE:https://console.rootflo.ai}
# Tokens are verified locally with the KMS public key, cached this long (s).
# A disabled or rotated KMS key is noticed when the cache refreshes.
# 0 = no cache: fetch the key on every request (instant revocation, slower).
public_key_cache_seconds=${JWT_PUBLIC_KEY_CACHE_SECONDS:600}
# A token whose signature doesn't match triggers at most one key refetch per
# this many seconds after a successful fetch (for key rotation), so forged
# tokens can't flood KMS. A failed fetch is not throttled by this setting.
# Both values must be finite and non-negative.
public_key_refresh_min_seconds=${JWT_PUBLIC_KEY_REFRESH_MIN_SECONDS:60}

[kms_signing]
key = ${KMS_SIGNING_KEY}
key_ring = ${KMS_KEY_RING:}
key_version = ${KMS_SIGNING_KEY_VERSION:}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[server]
host = ${FLOCONSOLE_HOST:0.0.0.0}
port = ${FLOCONSOLE_PORT:8002}
reload_log_level = ${FLOCONSOLE_RELOAD_LOG_LEVEL:info}
uvicorn_log_level = ${FLOCONSOLE_UVICORN_LOG_LEVEL:critical}

[web]
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}
