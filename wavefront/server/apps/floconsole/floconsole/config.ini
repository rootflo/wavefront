[cloud]
provider = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION}
project_id = ${CLOUD_PROJECT_ID}
location = ${CLOUD_LOCATION}

[database]
username = ${CONSOLE_DB_USERNAME}
password = ${CONSOLE_DB_PASSWORD}
host = ${CONSOLE_DB_HOST}
port = ${CONSOLE_DB_PORT}
db_name = ${CONSOLE_DB_NAME}

[deployment]
build_trigger_url=${BUILD_TRIGGER_URL}

[env_config]
app_env = ${APP_ENV:production}
passthrough_secret = ${PASSTHROUGH_SECRET:}

[jwt_token]
token_expiry=${TOKEN_EXPIRY:3600}
temporary_token_expiry=${TEMPORARY_TOKEN_EXPIRY:300}
token_prefix=${CONSOLE_TOKEN_PREFIX:fc_}
issuer=${CONSOLE_JWT_ISSUER:https://console.rootflo.ai}
audience=${CONSOLE_JWT_AUDIENCE:https://console.rootflo.ai}

[kms_signing]
key = ${KMS_SIGNING_KEY}
key_ring = ${KMS_KEY_RING}
key_version = ${KMS_SIGNING_KEY_VERSION}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[server]
host = ${FLOCONSOLE_HOST:0.0.0.0}
port = ${FLOCONSOLE_PORT:8002}
reload_log_level = ${FLOCONSOLE_RELOAD_LOG_LEVEL:info}
uvicorn_log_level = ${FLOCONSOLE_UVICORN_LOG_LEVEL:critical}

[web]
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}
