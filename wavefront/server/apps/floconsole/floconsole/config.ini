[database]
username = ${CONSOLE_DB_USERNAME}
password = ${CONSOLE_DB_PASSWORD}
host = ${CONSOLE_DB_HOST}
port = ${CONSOLE_DB_PORT}
db_name = ${CONSOLE_DB_NAME}

[env_config]
app_env = ${APP_ENV}
passthrough_secret = ${PASSTHROUGH_SECRET:}

[web]
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}

[cloud]
provider = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION}
project_id = ${CLOUD_PROJECT_ID}
location = ${CLOUD_LOCATION}

[kms_signing]
key_ring = ${KMS_KEY_RING}
key = ${KMS_SIGNING_KEY}
key_version = ${KMS_SIGNING_KEY_VERSION}

[kms_encryption]
key_ring = ${KMS_KEY_RING:}
key = ${KMS_ENCRYPTION_KEY:}
key_version = ${KMS_ENCRYPTION_KEY_VERSION:}

[storage]
application_bucket = ${APPLICATION_BUCKET:}
config_file_name = ${CONFIG_FILE_NAME:}

[queues]
rag = ${RAG_QUEUE:}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION:}
workflow_worker = ${WORKFLOW_QUEUE:}
workflow_subscription = ${WORKFLOW_QUEUE_SUBSCRIPTION:}
gold = ${GOLD_QUEUE:}

[azure]
account_url = ${AZURE_STORAGE_ACCOUNT_URL:}
key_vault_url = ${AZURE_KEY_VAULT_URL:}
client_id = ${AZURE_CLIENT_ID:}
tenant_id = ${AZURE_TENANT_ID:}
client_secret = ${AZURE_CLIENT_SECRET:}

[jwt_token]
token_expiry=${TOKEN_EXPIRY}
temporary_token_expiry=${TEMPORARY_TOKEN_EXPIRY}
private_key=${PRIVATE_KEY}
public_key=${PUBLIC_KEY}
enable_cloud_kms=${ENABLE_CLOUD_KMS}
token_prefix=${CONSOLE_TOKEN_PREFIX:fc_}
issuer=${CONSOLE_JWT_ISSUER:https://console.rootflo.ai}
audience=${CONSOLE_JWT_AUDIENCE:https://console.rootflo.ai}

[deployment]
build_trigger_url=${BUILD_TRIGGER_URL}
