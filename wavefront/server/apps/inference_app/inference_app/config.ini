[cloud]
provider = ${CLOUD_PROVIDER:}

[env_config]
app_env = ${APP_ENV:production}
app_name = ${APP_NAME:inference_app}

[inference]
max_embedding_batch_size = ${MAX_EMBEDDING_BATCH_SIZE:8}
max_text_embedding_batch_size = ${MAX_TEXT_EMBEDDING_BATCH_SIZE:16}
max_text_embedding_tokens = ${MAX_TEXT_EMBEDDING_TOKENS:512}
rate_limit_requests_per_second = ${RATE_LIMIT_REQUESTS_PER_SECOND:4}
rate_limit_requests_per_minute = ${RATE_LIMIT_REQUESTS_PER_MINUTE:240}

[models]
clip_vit_base_patch32_uri = ${CLIP_VIT_BASE_PATCH32_MODEL_URI:}
dinov3_vitl16_uri = ${DINOV3_VITL16_HF_MODEL_URI:}
bge_m3_uri = ${BGE_M3_MODEL_URI:}
cache_dir = ${MODEL_CACHE_DIR:/tmp/model-cache}
mock_models = ${INFERENCE_MOCK_MODELS:auto}

[server]
host = ${INFERENCE_HOST:0.0.0.0}
port = ${INFERENCE_PORT:8003}
reload_log_level = ${INFERENCE_RELOAD_LOG_LEVEL:info}
uvicorn_log_level = ${INFERENCE_UVICORN_LOG_LEVEL:critical}

[web]
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}
