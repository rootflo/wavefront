[call_eval]
azure_endpoint = ${CALL_EVAL_AZURE_ENDPOINT:}
azure_api_key = ${CALL_EVAL_AZURE_API_KEY:}
llm_model = ${CALL_EVAL_AZURE_LLM_MODEL:gpt-4.1}
api_version = ${CALL_EVAL_AZURE_API_VERSION:2025-01-01-preview}

[cloud]
platform = ${CLOUD_PROVIDER:}

[env_config]
app_env = ${APP_ENV:production}
app_name = ${APP_NAME:call_processing}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
floware_base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}
call_processing_base_url = ${CALL_PROCESSING_BASE_URL:http://localhost:8004}
worker_count = ${FLOWARE_WORKER_COUNT:1}
uvicorn_log_level = ${UVICORN_LOG_LEVEL:critical}
log_level = ${LOG_LEVEL:INFO}

[pipecat]
enable_tracing = ${CALL_PROCESSING_ENABLE_TRACING:true}
enable_turn_tracking = ${CALL_PROCESSING_ENABLE_TURN_TRACKING:true}
otlp_endpoint = ${CALL_PROCESSING_OTLP_ENDPOINT:}
tracing_service_name = ${CALL_PROCESSING_TRACING_SERVICE_NAME:call-processing}

[redis]
protocol = ${REDIS_PROTOCOL:redis}
host = ${REDIS_HOST:localhost}
port = ${REDIS_PORT:6379}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}
pool_size = ${REDIS_POOL_SIZE:10}
pool_timeout = ${REDIS_POOL_TIMEOUT:2}

[server]
host = ${CALL_PROCESSING_HOST:0.0.0.0}
port = ${CALL_PROCESSING_PORT:8004}
reload_log_level = ${CALL_PROCESSING_RELOAD_LOG_LEVEL:info}
uvicorn_log_level = ${CALL_PROCESSING_UVICORN_LOG_LEVEL:critical}

[webrtc]
# Browser-reachable base URL of the /api/webrtc signaling routes. Returned to the
# client by "create room". Point it at a public host, or at the floware gateway
# when call_processing is not exposed to browsers.
signaling_public_url = ${WEBRTC_SIGNALING_PUBLIC_URL:http://localhost:8004/api/webrtc}
# How long a created room can wait for its first offer
room_ttl_secs = ${WEBRTC_ROOM_TTL_SECS:600}
# Hard cap on a joined session
max_session_secs = ${WEBRTC_MAX_SESSION_SECS:1800}
# Give up on a peer connection that never reaches "connected"
connect_timeout_secs = ${WEBRTC_CONNECT_TIMEOUT_SECS:60}
# Pipeline + STT/TTS sample rate for browser sessions (telephony stays at 8 kHz)
sample_rate = ${WEBRTC_SAMPLE_RATE:16000}
# Comma separated STUN/TURN urls used by the server-side peer connection
ice_servers = ${WEBRTC_ICE_SERVERS:stun:stun.l.google.com:19302}

[web]
# The console (Vite) origin; set ALLOWED_ORIGINS in production
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}
