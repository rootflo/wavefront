[project]
name = "call_processing"
version = "0.1.0"
description = "Voice agents call processing backend for rootflo apps"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    # Shared middleware (security headers)
    "common-module",
    # FastAPI stack
    "fastapi>=0.115.2,<1.0.0",
    "uvicorn>=0.30.5,<1.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.1.0,<2.0.0",
    "pydantic>=2.0.0",
    "dependency-injector>=4.46.0,<5.0.0",
    "flo-lib",
    # KMS envelope decryption of stored provider credentials
    "flo-cloud",
    # Redis and caching
    "redis>=5.0.0",
    "azure-identity>=1.17.0,<2.0.0",
    "tenacity>=8.0.0",
    # Pipecat and voice processing
    "pipecat-ai[aws,websocket,cartesia,google,silero,deepgram,groq,runner,azure,sarvam,tracing,webrtc]==1.12.0",
    # Required by LocalSmartTurnAnalyzerV3 (imported at startup). Declared
    # explicitly so Docker/Linux installs are not lost if workspace overrides
    # rewrite pipecat's transitive onnxruntime requirement.
    "onnxruntime~=1.24.3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0.0",
    # Twilio
    "twilio>=8.0.0",
]


[dependency-groups]
dev = ["flo-testing"]

[tool.uv.sources]
common-module = { workspace = true }
flo-cloud = { workspace = true }
flo-lib = { workspace = true }
flo-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_processing"]
