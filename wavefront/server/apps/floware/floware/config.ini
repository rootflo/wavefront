[auth]
max_failed_attempts=${MAX_FAILED_ATTEMPTS:3}
hmac_routes=${HMAC_AUTH_ROUTES:}
mtls_allowed_namespaces=${MTLS_ALLOWED_NAMESPACES:client-applications,gpu-processing}
lockout_duration_hours=${LOCKOUT_DURATION_HOURS:24}
inactive_days_threshold=${INACTIVE_DAYS_THRESHOLD:60}
password_reset_cooldown_seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
password_reset_max_per_email=${PASSWORD_RESET_MAX_PER_EMAIL:3}
password_reset_rate_window_seconds=${PASSWORD_RESET_RATE_WINDOW_SECONDS:3600}

[celery]
broker_url = ${CELERY_BROKER_URL:redis://localhost:6379/0}
queue_name = ${CELERY_QUEUE_NAME:celery}
max_queue_depth = ${CELERY_MAX_QUEUE_DEPTH:10000}
queue_depth_cache_ttl_seconds = ${CELERY_QUEUE_DEPTH_CACHE_TTL_SECONDS:1.0}
queue_depth_warn_ratio = ${CELERY_QUEUE_DEPTH_WARN_RATIO:0.8}
backpressure_retry_after_seconds = ${CELERY_BACKPRESSURE_RETRY_AFTER_SECONDS:30}
broker_socket_timeout_seconds = ${CELERY_BROKER_SOCKET_TIMEOUT_SECONDS:2.0}
max_execution_attempts = ${CELERY_MAX_EXECUTION_ATTEMPTS:3}

[cloud]
platform = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION:}
project_id = ${CLOUD_PROJECT_ID:}

[database]
username = ${DB_USERNAME}
password = ${DB_PASSWORD}
host = ${DB_HOST}
port = ${DB_PORT}
db_name = ${DB_NAME}
pool_size = ${DB_POOL_SIZE:20}
max_overflow = ${DB_MAX_OVERFLOW:20}
pool_timeout = ${DB_POOL_TIMEOUT:30}
pool_recycle = ${DB_POOL_RECYCLE:1800}
ingestion_pool_size = ${DB_INGESTION_POOL_SIZE:10}
ingestion_max_overflow = ${DB_INGESTION_MAX_OVERFLOW:10}
ingestion_pool_timeout = ${DB_INGESTION_POOL_TIMEOUT:30}
ingestion_pool_recycle = ${DB_INGESTION_POOL_RECYCLE:1800}

[datasource]
# Limits on calls to external datasources, per uvicorn worker. Requests and
# scheduled reports get separate thread pools. A request that cannot get a
# thread within queue_wait_seconds is answered 503 "busy".
max_threads = ${DATASOURCE_MAX_THREADS:16}
scheduled_max_threads = ${DATASOURCE_SCHEDULED_MAX_THREADS:4}
queue_wait_seconds = ${DATASOURCE_QUEUE_WAIT_SECONDS:10}
connect_timeout_seconds = ${DATASOURCE_CONNECT_TIMEOUT_SECONDS:30}
statement_timeout_seconds = ${DATASOURCE_STATEMENT_TIMEOUT_SECONDS:30}
scheduled_statement_timeout_seconds = ${DATASOURCE_SCHEDULED_STATEMENT_TIMEOUT_SECONDS:300}

[env_config]
app_env = ${APP_ENV:production}
app_name = ${APP_NAME:floware}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}
worker_count = ${FLOWARE_WORKER_COUNT:4}
uvicorn_log_level = ${UVICORN_LOG_LEVEL:critical}
log_level = ${LOG_LEVEL:INFO}

[feature_flags]
ALLOW_NON_ADMIN_ALL_DATA_ACCESS_FLAG = ${ALLOW_NON_ADMIN_ALL_DATA_ACCESS_FLAG:false}
DATASOURCE_AUDIT_ENABLED_FLAG = ${DATASOURCE_AUDIT_ENABLED_FLAG:false}
DATASOURCE_CHANGE_NOTIFICATION_FLAG = ${DATASOURCE_CHANGE_NOTIFICATION_FLAG:false}
INACTIVE_ACCOUNT_DISABLE_FLAG = ${INACTIVE_ACCOUNT_DISABLE_FLAG:false}
SUPERSET_FLAG = ${SUPERSET_FLAG:false}
ENVELOPE_ENCRYPTION_ENABLED = ${ENVELOPE_ENCRYPTION_ENABLED:false}

[guardrails]
enabled = ${GUARDRAILS_ENABLED:false}
verdict_cache_chars = ${GUARDRAILS_VERDICT_CACHE_CHARS:}
verdict_cache_secret = ${GUARDRAILS_VERDICT_CACHE_SECRET:}
verdict_cache_ttl = ${GUARDRAILS_VERDICT_CACHE_TTL:}
verdict_cache_shared = ${GUARDRAILS_VERDICT_CACHE_SHARED:true}
regex_timeout_seconds = ${REGEX_TIMEOUT_SECONDS:2}
azure_content_safety_endpoint = ${AZURE_CONTENT_SAFETY_ENDPOINT:}
azure_content_safety_key = ${AZURE_CONTENT_SAFETY_KEY:}
spacy_model_url = ${GUARDRAILS_SPACY_MODEL_URL:}
# Cache directory for downloaded spaCy models (default ~/.cache/wavefront/spacy)
model_cache_dir = ${GUARDRAILS_MODEL_CACHE_DIR:}

[hermes]
url=${HERMES_URL:http://localhost:8080/flo-hermes}

[message_processor]
# Processor YAML is cached in Redis this long (s), so executing a processor
# skips the storage download. 0 = no cache (read storage every time).
yaml_cache_seconds=${MESSAGE_PROCESSOR_YAML_CACHE_SECONDS:3600}

[jwt_token]
token_expiry=${TOKEN_EXPIRY:3600}
temporary_token_expiry=${TEMPORARY_TOKEN_EXPIRY:600}
console_token_prefix=${CONSOLE_TOKEN_PREFIX:fc_}
issuer=${FLOWARE_JWT_ISSUER:https://floware.rootflo.ai}
audience=${FLOWARE_JWT_AUDIENCE:https://floware.rootflo.ai}
validation_issuer=${FLOWARE_JWT_VALIDATION_ISSUER:https://console.rootflo.ai,https://floware.rootflo.ai}
# Tokens are verified locally with the KMS public key, cached this long (s).
# A rotated key is picked up when the cache refreshes. Do not rely on this to
# revoke tokens: on AWS KMS, disabling the signing key does not stop
# GetPublicKey, so already-issued tokens keep verifying until they expire.
# 0 = no cache: fetch the key on every request (slower).
public_key_cache_seconds=${JWT_PUBLIC_KEY_CACHE_SECONDS:600}
# A token whose signature doesn't match triggers at most one key refetch per
# this many seconds after a successful fetch (for key rotation), so forged
# tokens can't flood KMS. A failed fetch is not throttled by this setting.
# Both values must be finite and non-negative.
public_key_refresh_min_seconds=${JWT_PUBLIC_KEY_REFRESH_MIN_SECONDS:60}

[kms_encryption]
key = ${KMS_ENCRYPTION_KEY}
key_ring = ${KMS_KEY_RING:}
key_version = ${KMS_ENCRYPTION_KEY_VERSION:}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[kms_signing]
key = ${KMS_SIGNING_KEY}
key_ring = ${KMS_KEY_RING:}
key_version = ${KMS_SIGNING_KEY_VERSION:}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[knowledge_base]
exact_match_max_candidates=${KB_EXACT_MATCH_MAX_CANDIDATES:1000}

[model]
inference_service_url=${INFERENCE_SERVICE_URL:}
azure_openai_api_version = ${AZURE_OPENAI_API_VERSION:}

[product_analysis]
excluded_emails = ${PRODUCT_ANALYTICS_EXCLUDED_EMAILS:}

[queues]
rag = ${RAG_QUEUE}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION:}
gold = ${GOLD_QUEUE:}

[recaptcha]
enabled=${RECAPTCHA_ENABLED:false}
project_id=${RECAPTCHA_PROJECT_ID:}
site_key=${RECAPTCHA_SITE_KEY:}
score_threshold=${RECAPTCHA_SCORE_THRESHOLD:0.5}

[redis]
protocol = ${REDIS_PROTOCOL}
host = ${REDIS_HOST}
port = ${REDIS_PORT}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}
pool_size = ${REDIS_POOL_SIZE:20}
pool_timeout = ${REDIS_POOL_TIMEOUT:2}
# Calls to Redis still run on the event loop, so a slow Redis stalls every
# request in the worker. Keep these short so a stall stays bounded:
# worst case per call is about max_retries x (connect + socket wait, plus any
# wait for a free pool connection) plus the backoff; socket_timeout alone is
# not a bound on the whole call.
# socket_timeout must stay above the stream consumers' block time (1 s).
socket_timeout = ${REDIS_SOCKET_TIMEOUT:5}
connection_timeout = ${REDIS_CONNECT_TIMEOUT:3}
# Total attempts per call, and the exponential wait between them (seconds).
max_retries = ${REDIS_MAX_RETRIES:2}
initial_backoff = ${REDIS_INITIAL_BACKOFF:0.1}
max_backoff = ${REDIS_MAX_BACKOFF:0.5}
# Async client used on the request path (auth session lookup): it waits on the
# event loop without blocking it. Its own pool, so it counts against Redis
# maxclients alongside pool_size. A whole async call (retries included) gives
# up after async_command_timeout seconds.
async_pool_size = ${REDIS_ASYNC_POOL_SIZE:20}
async_command_timeout = ${REDIS_ASYNC_COMMAND_TIMEOUT:1}

[scheduler]
worker_id = ${SCHEDULER_WORKER_ID:floware-worker}

[server]
host = ${FLOWARE_SERVER_HOST:0.0.0.0}
port = ${FLOWARE_SERVER_PORT:8001}
reload_log_level = ${FLOWARE_RELOAD_LOG_LEVEL:info}

[storage]
application_bucket = ${APPLICATION_BUCKET}
config_file_name = ${CONFIG_FILE_NAME:}
account_url = ${STORAGE_ACCOUNT_URL:}
asset_url = ${APPLICATION_STORAGE_URL:}

[streams]
async_agentic_exec_results = ${ASYNC_AGENTIC_EXEC_RESULTS_STREAM:async_agentic_exec:results}
async_agentic_exec_consumer_group = ${ASYNC_AGENTIC_EXEC_CONSUMER_GROUP:floware-agentic-consumers}
async_agentic_exec_poll_interval_s = ${ASYNC_AGENTIC_EXEC_POLL_INTERVAL_S:5}
async_agentic_exec_heartbeat_s = ${ASYNC_AGENTIC_EXEC_HEARTBEAT_S:60}
kb_index_status_consumer_group = ${KB_INDEX_STATUS_CONSUMER_GROUP:floware-kb-index-status}
kb_index_status_poll_interval_s = ${KB_INDEX_STATUS_POLL_INTERVAL_S:5}
kb_index_status_heartbeat_s = ${KB_INDEX_STATUS_HEARTBEAT_S:60}
kb_index_status_reclaim_interval_s = ${KB_INDEX_STATUS_RECLAIM_INTERVAL_S:60}
kb_index_status_reclaim_min_idle_ms = ${KB_INDEX_STATUS_RECLAIM_MIN_IDLE_MS:60000}
kb_index_status_max_deliveries = ${KB_INDEX_STATUS_MAX_DELIVERIES:5}
consumer_shutdown_timeout_s = ${STREAM_CONSUMER_SHUTDOWN_TIMEOUT_S:5}

[superset]
url=${SUPERSET_URL:}
username=${SUPERSET_USERNAME:}
password=${SUPERSET_PASSWORD:}

[blocking_io]
# Thread pools for blocking SDK calls made from async code (KMS, object storage,
# CPU work such as bcrypt), per uvicorn worker. Separate from [datasource].
# A call that can't get a thread within queue_wait_seconds raises
# BlockingPoolBusyError; when that reaches the app's handler the request gets 503.
kms_max_threads = ${BLOCKING_IO_KMS_MAX_THREADS:8}
storage_max_threads = ${BLOCKING_IO_STORAGE_MAX_THREADS:16}
cpu_max_threads = ${BLOCKING_IO_CPU_MAX_THREADS:4}
queue_wait_seconds = ${BLOCKING_IO_QUEUE_WAIT_SECONDS:10}

[event_loop_monitor]
# Warns, and counts in OTel, when the event loop runs more than threshold_ms
# late: some async code is doing blocking work. interval_ms is how often it
# checks. After stack_threshold_ms it records the loop thread's stack, so the
# warning shows what was blocking. Warnings are logged at most once per
# log_cooldown_seconds; the metrics count every block.
# Off by default; set EVENT_LOOP_MONITOR_ENABLED=true to turn it on.
enabled = ${EVENT_LOOP_MONITOR_ENABLED:false}
threshold_ms = ${EVENT_LOOP_LAG_THRESHOLD_MS:50}
interval_ms = ${EVENT_LOOP_MONITOR_INTERVAL_MS:100}
stack_threshold_ms = ${EVENT_LOOP_STACK_THRESHOLD_MS:250}
log_cooldown_seconds = ${EVENT_LOOP_LOG_COOLDOWN_SECONDS:30}

[telemetry]
otlp_endpoint = ${OTEL_EXPORTER_OTLP_ENDPOINT:}
service_name = ${OTEL_SERVICE_NAME:}
app_version = ${APP_VERSION:0.1.0}
instance_id = ${HOSTNAME:}

[sentry]
# Error reporting (errors only; OTel stays the tracer). Off while dsn is empty.
# Never commit a DSN: set SENTRY_DSN per deployment.
dsn = ${SENTRY_DSN:}
# Empty falls back to [env_config] app_env.
environment = ${SENTRY_ENVIRONMENT:}
# The git sha of the deployed image, so issues show the release they started in.
release = ${SENTRY_RELEASE:}
sample_rate = ${SENTRY_SAMPLE_RATE:1.0}
# Log lines at this level and above become breadcrumbs on later events. Keep
# WARNING until INFO logs are free of secrets and personal data.
breadcrumb_level = ${SENTRY_BREADCRUMB_LEVEL:WARNING}
# Report event-loop blocks over [event_loop_monitor] stack_threshold_ms as issues.
# Needs the monitor on too: [event_loop_monitor] enabled (off by default).
loop_blocks = ${SENTRY_LOOP_BLOCKS:true}
# Most Sentry events this process sends a minute (at most 5 from any one place).
max_events_per_minute = ${SENTRY_MAX_EVENTS_PER_MINUTE:30}

[voice_agents]
call_processing_base_url=${CALL_PROCESSING_BASE_URL:}
exotel_app_id = ${EXOTEL_APP_ID:}
# Browser voice sessions: when true, browsers signal through floware
# (POST|PATCH /floware/v1/webrtc/offer) instead of reaching call_processing directly.
webrtc_signaling_via_floware = ${WEBRTC_SIGNALING_VIA_FLOWARE:false}

[web]
url=${WEB_URL:}
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}
