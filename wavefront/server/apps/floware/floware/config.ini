[env_config]
app_env = ${APP_ENV}
app_name = ${APP_NAME:floware}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}
worker_count = ${FLOWARE_WORKER_COUNT:4}
uvicorn_log_level = ${UVICORN_LOG_LEVEL:critical}
log_level = ${LOG_LEVEL:INFO}

[database]
username = ${DB_USERNAME}
password = ${DB_PASSWORD}
host = ${DB_HOST}
port = ${DB_PORT}
db_name = ${DB_NAME}
pool_size = ${DB_POOL_SIZE:20}
max_overflow = ${DB_MAX_OVERFLOW:20}
pool_timeout = ${DB_POOL_TIMEOUT:30}
pool_recycle = ${DB_POOL_RECYCLE:1800}
ingestion_pool_size = ${DB_INGESTION_POOL_SIZE:10}
ingestion_max_overflow = ${DB_INGESTION_MAX_OVERFLOW:10}
ingestion_pool_timeout = ${DB_INGESTION_POOL_TIMEOUT:30}
ingestion_pool_recycle = ${DB_INGESTION_POOL_RECYCLE:1800}

[redis]
protocol = ${REDIS_PROTOCOL}
host = ${REDIS_HOST}
port = ${REDIS_PORT}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}
pool_size = ${REDIS_POOL_SIZE:20}
pool_timeout = ${REDIS_POOL_TIMEOUT:2}

[cloud]
provider = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION}
project_id = ${CLOUD_PROJECT_ID}
location = ${CLOUD_LOCATION}

[storage]
application_bucket = ${APPLICATION_BUCKET}
config_file_name = ${CONFIG_FILE_NAME}
account_url = ${STORAGE_ACCOUNT_URL:}

[queues]
rag = ${RAG_QUEUE}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION}
gold = ${GOLD_QUEUE}

[kms_signing]
key_ring = ${KMS_KEY_RING}
key = ${KMS_SIGNING_KEY}
key_version = ${KMS_SIGNING_KEY_VERSION}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[kms_encryption]
key_ring = ${KMS_KEY_RING}
key = ${KMS_ENCRYPTION_KEY}
key_version = ${KMS_ENCRYPTION_KEY_VERSION}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[jwt_token]
token_expiry=${TOKEN_EXPIRY}
temporary_token_expiry=${TEMPORARY_TOKEN_EXPIRY}
enable_cloud_kms=${ENABLE_CLOUD_KMS}
console_token_prefix=${CONSOLE_TOKEN_PREFIX:fc_}
issuer=${FLOWARE_JWT_ISSUER:https://floware.rootflo.ai}
audience=${FLOWARE_JWT_AUDIENCE:https://floware.rootflo.ai}
validation_issuer=${FLOWARE_JWT_VALIDATION_ISSUER:https://console.rootflo.ai,https://floware.rootflo.ai}

[superset]
url=${SUPERSET_URL}
username=${SUPERSET_USERNAME}
password=${SUPERSET_PASSWORD}

[web]
url=${WEB_URL}
allowed_origins=${ALLOWED_ORIGINS:http://localhost:5173}

[auth]
max_failed_attempts=${MAX_FAILED_ATTEMPTS}
hmac_routes=${HMAC_AUTH_ROUTES:}
mtls_allowed_namespaces=${MTLS_ALLOWED_NAMESPACES:client-applications,gpu-processing}
lockout_duration_hours=${LOCKOUT_DURATION_HOURS}
inactive_days_threshold=${INACTIVE_DAYS_THRESHOLD:60}
password_reset_cooldown_seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
password_reset_max_per_email=${PASSWORD_RESET_MAX_PER_EMAIL:3}
password_reset_rate_window_seconds=${PASSWORD_RESET_RATE_WINDOW_SECONDS:3600}

[recaptcha]
enabled=${RECAPTCHA_ENABLED:false}
project_id=${RECAPTCHA_PROJECT_ID}
site_key=${RECAPTCHA_SITE_KEY}
score_threshold=${RECAPTCHA_SCORE_THRESHOLD:0.5}

[celery]
broker_url = ${CELERY_BROKER_URL:redis://localhost:6379/0}

[telemetry]
otlp_endpoint = ${OTEL_EXPORTER_OTLP_ENDPOINT:}
service_name = ${OTEL_SERVICE_NAME:}
app_version = ${APP_VERSION:0.1.0}
instance_id = ${HOSTNAME:}

[streams]
async_agentic_exec_results = ${ASYNC_AGENTIC_EXEC_RESULTS_STREAM:async_agentic_exec:results}
async_agentic_exec_consumer_group = ${ASYNC_AGENTIC_EXEC_CONSUMER_GROUP:floware-agentic-consumers}
async_agentic_exec_poll_interval_s = ${ASYNC_AGENTIC_EXEC_POLL_INTERVAL_S:5}
async_agentic_exec_heartbeat_s = ${ASYNC_AGENTIC_EXEC_HEARTBEAT_S:60}
kb_index_status_consumer_group = ${KB_INDEX_STATUS_CONSUMER_GROUP:floware-kb-index-status}
kb_index_status_poll_interval_s = ${KB_INDEX_STATUS_POLL_INTERVAL_S:5}
kb_index_status_heartbeat_s = ${KB_INDEX_STATUS_HEARTBEAT_S:60}
kb_index_status_reclaim_interval_s = ${KB_INDEX_STATUS_RECLAIM_INTERVAL_S:60}
kb_index_status_reclaim_min_idle_ms = ${KB_INDEX_STATUS_RECLAIM_MIN_IDLE_MS:60000}
kb_index_status_max_deliveries = ${KB_INDEX_STATUS_MAX_DELIVERIES:5}

[scheduler]
worker_id = ${SCHEDULER_WORKER_ID:}

[guardrails]
verdict_cache_chars = ${GUARDRAILS_VERDICT_CACHE_CHARS:}
verdict_cache_secret = ${GUARDRAILS_VERDICT_CACHE_SECRET:}
verdict_cache_ttl = ${GUARDRAILS_VERDICT_CACHE_TTL:}
verdict_cache_shared = ${GUARDRAILS_VERDICT_CACHE_SHARED:true}
azure_content_safety_endpoint = ${AZURE_CONTENT_SAFETY_ENDPOINT:}
azure_content_safety_key = ${AZURE_CONTENT_SAFETY_KEY:}

[feature_flags]
ALLOW_NON_ADMIN_ALL_DATA_ACCESS_FLAG = ${ALLOW_NON_ADMIN_ALL_DATA_ACCESS_FLAG:false}
AZURE_FLAG = ${AZURE_FLAG:false}
AZURE_OPENAI_FLAG = ${AZURE_OPENAI_FLAG:false}
CELERY_FLAG = ${CELERY_FLAG:false}
DATASOURCE_AUDIT_ENABLED_FLAG = ${DATASOURCE_AUDIT_ENABLED_FLAG:false}
DATASOURCE_CHANGE_NOTIFICATION_FLAG = ${DATASOURCE_CHANGE_NOTIFICATION_FLAG:false}
EMAIL_SYNC_FLAG = ${EMAIL_SYNC_FLAG:false}
GOOGLE_FLAG = ${GOOGLE_FLAG:false}
INACTIVE_ACCOUNT_DISABLE_FLAG = ${INACTIVE_ACCOUNT_DISABLE_FLAG:false}
SAML_FLAG = ${SAML_FLAG:false}
SLACK_FLAG = ${SLACK_FLAG:false}
SUPERSET_FLAG = ${SUPERSET_FLAG:false}
VECTOR_DB_FLAG = ${VECTOR_DB_FLAG:false}

[product_analysis]
excluded_emails = ${PRODUCT_ANALYTICS_EXCLUDED_EMAILS:}

[model]
inference_service_url=${INFERENCE_SERVICE_URL}
azure_openai_api_version = ${AZURE_OPENAI_API_VERSION:}

[knowledge_base]
exact_match_max_candidates=${KB_EXACT_MATCH_MAX_CANDIDATES:1000}

[image_search]
reference_images_bucket = ${IMAGE_SEARCH_REFERENCE_IMAGES_BUCKET}

[voice_agents]
call_processing_base_url=${CALL_PROCESSING_BASE_URL}
exotel_app_id = ${EXOTEL_APP_ID:}

[hermes]
url=${HERMES_URL:http://localhost:8080/flo-hermes}
