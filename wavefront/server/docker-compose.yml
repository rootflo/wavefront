services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=floware
    ports:
      - '5432:5432'
    volumes:
      - /var/lib/postgres-data:/var/lib/postgresql/data
      - /var/lib/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - floware-network

  # Celery broker and floware cache. noeviction so queued tasks are never
  # evicted; at the cap, writes fail and reads keep working.
  redis:
    image: redis:7.4
    container_name: redis
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - noeviction
      - --maxmemory-clients
      - ${REDIS_MAXMEMORY_CLIENTS:-5%}
    ports:
      - "6379:6379"
    networks:
      - floware-network

  # Local S3 + SQS for CLOUD_PROVIDER=aws.
  # Pinned to 4.14, the last community release that runs without LOCALSTACK_AUTH_TOKEN.
  # State is in-memory; dev-start.sh creates the bucket and queue after it starts.
  localstack:
    image: localstack/localstack:4.14
    container_name: localstack
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICES=s3,sqs,kms
      - SQS_ENDPOINT_STRATEGY=path
      - LOCALSTACK_HOST=localhost:4566
    ports:
      - '4566:4566'
    volumes:
      # Runs on every start (community 4.14 has no persistence): recreates KMS
      # keys, bucket, CORS and queue, then restores the S3 objects from the
      # snapshot below. See init-ready.d/01-restore.sh.
      - ./localstack/init-ready.d:/etc/localstack/init/ready.d:ro
      # Object source for the restore. Produced by
      # scripts/migrate_assets_to_localstack.py --mode pull; gitignored, so this
      # is empty (and the restore a no-op) until a snapshot exists.
      - ./scripts/.asset_snapshot:/opt/asset-snapshot:ro
    networks:
      - floware-network

volumes:
  db:
    driver: local

networks:
  floware-network:
    driver: bridge
