services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=floware
    ports:
      - '5432:5432'
    volumes:
      - /var/lib/postgres-data:/var/lib/postgresql/data
      - /var/lib/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - floware-network

  redis:
    image: redis:7.4
    container_name: redis
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    networks:
      - floware-network

  # Local S3 + SQS for CLOUD_PROVIDER=aws.
  # Official localstack/localstack community (incl. 4.14) does not persist state —
  # PERSISTENCE=1 is Pro-only. gresau/localstack-persist is a community drop-in
  # that saves S3/KMS/SQS under /persisted-data across restarts. Pin major.minor
  # to match the last LocalStack that runs without LOCALSTACK_AUTH_TOKEN.
  # Do not set PERSISTENCE=1 here (that enables LocalStack's unused Pro path).
  # dev-start.sh still idempotently ensures the bucket, queue, and keys exist.
  localstack:
    image: gresau/localstack-persist:4.14
    container_name: localstack
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICES=s3,sqs,kms
      - SQS_ENDPOINT_STRATEGY=path
      - LOCALSTACK_HOST=localhost:4566
    ports:
      - '4566:4566'
    volumes:
      - localstack-data:/persisted-data
    networks:
      - floware-network

volumes:
  db:
    driver: local
  localstack-data:
    driver: local

networks:
  floware-network:
    driver: bridge
