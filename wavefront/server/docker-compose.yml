services:
  postgres:
    image: ankane/pgvector
    container_name: postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=floware
    ports:
      - '5432:5432'
    volumes:
      - /var/lib/postgres-data:/var/lib/postgresql/data
      - /var/lib/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - floware-network

  redis:
    image: redis:7.4
    container_name: redis
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    networks:
      - floware-network

  # Local S3 + SQS for CLOUD_PROVIDER=aws.
  # Pinned to 4.14, the last community release that runs without LOCALSTACK_AUTH_TOKEN.
  # State is in-memory; setup.sh creates the bucket and queue after it starts.
  localstack:
    image: localstack/localstack:4.14
    container_name: localstack
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICES=s3,sqs,kms
      - SQS_ENDPOINT_STRATEGY=path
      - LOCALSTACK_HOST=localhost:4566
    ports:
      - '4566:4566'
    networks:
      - floware-network

volumes:
  db:
    driver: local

networks:
  floware-network:
    driver: bridge
