[env_config]
app_env = ${APP_ENV:dev}
app_name = ${APP_NAME:rag_ingestion}

[cloud]
provider = ${CLOUD_PROVIDER:gcp}
region = ${CLOUD_REGION:}
project_id = ${CLOUD_PROJECT_ID:}
location = ${CLOUD_LOCATION:}

[storage]
application_bucket = ${APPLICATION_BUCKET:}
config_file_name = ${CONFIG_FILE_NAME:}

[queues]
rag = ${RAG_QUEUE}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION}
workflow_worker = ${WORKFLOW_QUEUE:}
workflow_subscription = ${WORKFLOW_QUEUE_SUBSCRIPTION:}
gold = ${GOLD_QUEUE:}

[kms_signing]
key_ring = ${KMS_KEY_RING:}
key = ${KMS_SIGNING_KEY:}
key_version = ${KMS_SIGNING_KEY_VERSION:}

[kms_encryption]
key_ring = ${KMS_KEY_RING:}
key = ${KMS_ENCRYPTION_KEY:}
key_version = ${KMS_ENCRYPTION_KEY_VERSION:}

[azure]
account_url = ${AZURE_STORAGE_ACCOUNT_URL:}
key_vault_url = ${AZURE_KEY_VAULT_URL:}
client_id = ${AZURE_CLIENT_ID:}
tenant_id = ${AZURE_TENANT_ID:}
client_secret = ${AZURE_CLIENT_SECRET:}

[redis]
protocol = ${REDIS_PROTOCOL:redis}
host = ${REDIS_HOST:localhost}
port = ${REDIS_PORT:6379}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}

[embedding_url]
embedding_service_url = ${EMBEDDING_SERVICE_URL:}

[model]
inference_service_url = ${INFERENCE_SERVICE_URL:}

[app_config]
retry_count = ${RETRY_COUNT:3}
streaming_batch_size = ${STREAMING_BATCH_SIZE:100}
floware_service_url = ${FLOWARE_SERVICE_URL:}
passthrough_secret = ${PASSTHROUGH_SECRET:}
embedding_model = ${EMBEDDING_MODEL:text-embedding-3-small}
