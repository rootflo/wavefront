[app_config]
retry_count = ${RETRY_COUNT:3}
streaming_batch_size = ${STREAMING_BATCH_SIZE:10}
floware_app_name = ${FLOWARE_APP_NAME:floware}

[cloud]
platform = ${CLOUD_PROVIDER:gcp}
region = ${CLOUD_REGION:}
project_id = ${CLOUD_PROJECT_ID:}

[env_config]
app_env = ${APP_ENV:production}
app_name = ${APP_NAME:rag_ingestion}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}
worker_count = ${FLOWARE_WORKER_COUNT:1}
uvicorn_log_level = ${UVICORN_LOG_LEVEL:critical}

[kms_encryption]
key = ${KMS_ENCRYPTION_KEY:}
key_ring = ${KMS_KEY_RING:}
key_version = ${KMS_ENCRYPTION_KEY_VERSION:}
key_vault_url = ${KMS_KEY_VAULT_URL:}

[model]
inference_service_url = ${INFERENCE_SERVICE_URL:}
# Keep at or below the inference app's MAX_TEXT_EMBEDDING_BATCH_SIZE (16).
text_embedding_batch_size = ${TEXT_EMBEDDING_BATCH_SIZE:16}
# Keep at or below the inference app's MAX_EMBEDDING_BATCH_SIZE (8).
image_embedding_batch_size = ${IMAGE_EMBEDDING_BATCH_SIZE:8}

[queues]
rag = ${RAG_QUEUE}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION:}

[redis]
protocol = ${REDIS_PROTOCOL:redis}
host = ${REDIS_HOST:localhost}
port = ${REDIS_PORT:6379}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}
pool_size = ${REDIS_POOL_SIZE:20}
pool_timeout = ${REDIS_POOL_TIMEOUT:2}

[storage]
account_url = ${STORAGE_ACCOUNT_URL:}

[voice_agents]
call_processing_base_url = ${CALL_PROCESSING_BASE_URL:}

[web]
allowed_origins = ${ALLOWED_ORIGINS:http://localhost:5173}
