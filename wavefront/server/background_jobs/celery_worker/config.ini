[env_config]
app_env = ${APP_ENV:dev}
app_name = ${APP_NAME:celery_worker}
base_url = ${FLOWARE_BASE_URL:http://localhost:8001}
passthrough_secret = ${PASSTHROUGH_SECRET:}

[cloud]
provider = ${CLOUD_PROVIDER}
region = ${CLOUD_REGION:}
project_id = ${CLOUD_PROJECT_ID:}
location = ${CLOUD_LOCATION:}

[storage]
application_bucket = ${APPLICATION_BUCKET}
config_file_name = ${CONFIG_FILE_NAME:}

[queues]
rag = ${RAG_QUEUE:}
rag_subscription = ${RAG_QUEUE_SUBSCRIPTION:}
workflow_worker = ${WORKFLOW_QUEUE:}
workflow_subscription = ${WORKFLOW_QUEUE_SUBSCRIPTION:}
gold = ${GOLD_QUEUE:}

[kms_signing]
key_ring = ${KMS_KEY_RING:}
key = ${KMS_SIGNING_KEY:}
key_version = ${KMS_SIGNING_KEY_VERSION:}

[kms_encryption]
key_ring = ${KMS_KEY_RING:}
key = ${KMS_ENCRYPTION_KEY:}
key_version = ${KMS_ENCRYPTION_KEY_VERSION:}

[azure]
account_url = ${AZURE_STORAGE_ACCOUNT_URL:}
key_vault_url = ${AZURE_KEY_VAULT_URL:}
client_id = ${AZURE_CLIENT_ID:}
tenant_id = ${AZURE_TENANT_ID:}
client_secret = ${AZURE_CLIENT_SECRET:}

[redis]
protocol = ${REDIS_PROTOCOL:redis}
host = ${REDIS_HOST:localhost}
port = ${REDIS_PORT:6379}
password = ${REDIS_PASSWORD:}
db = ${REDIS_DB:0}

[database]
username = ${DB_USERNAME}
password = ${DB_PASSWORD}
host = ${DB_HOST}
port = ${DB_PORT}
db_name = ${DB_NAME}
pool_size = ${DB_POOL_SIZE:20}
max_overflow = ${DB_MAX_OVERFLOW:20}
pool_timeout = ${DB_POOL_TIMEOUT:30}
pool_recycle = ${DB_POOL_RECYCLE:1800}

[hermes]
url = ${HERMES_URL:}

[triggers_gmail]
pubsub_project_id = ${CLOUD_PROJECT_ID:}
pubsub_topic_prefix = ${GMAIL_PUBSUB_TOPIC_PREFIX:agentic-trigger}
push_endpoint_template = ${GMAIL_PUSH_ENDPOINT_TEMPLATE:}
oidc_service_account_email = ${GMAIL_PUBSUB_OIDC_SA_EMAIL:}
