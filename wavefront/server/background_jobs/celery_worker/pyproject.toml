[project]
name = "celery-worker"
version = "0.1.0"
description = "Async agent and workflow execution via Celery"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "agents-module",
    "db-repo-module",
    "flo-cloud",
    "flo-utils",
    "tools-module",
    "api-services-module",
    "common-module",
    "triggers-module",
    "llm-inference-config-module",
    "celery[redis]>=5.5.3,<6.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
]

[tool.uv.sources]
agents-module       = { workspace = true }
db-repo-module      = { workspace = true }
flo-cloud           = { workspace = true }
flo-utils           = { workspace = true }
tools-module        = { workspace = true }
api-services-module = { workspace = true }
common-module       = { workspace = true }
triggers-module               = { workspace = true }
llm-inference-config-module   = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celery_worker"]
