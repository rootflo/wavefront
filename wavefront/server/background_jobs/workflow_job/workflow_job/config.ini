[app_config]
thread_count = ${THREAD_COUNT:3}
app_env = ${APP_ENV:dev}
passthrough_secret = ${PASSTHROUGH_SECRET}
batch_size = ${BATCH_SIZE:5}

[agents]
agent_yaml_bucket = ${AGENT_YAML_BUCKET}

[cloud_config]
cloud_provider = ${CLOUD_PROVIDER}

[gcp_config]
project_id  = ${GCP_PROJECT_ID}
pubsub_subscription_id = ${GCP_PUBSUB_SUBSCRIPTION_ID}
pubsub_topic_id = ${GCP_PUBSUB_TOPIC_ID}
bucket = ${APPLICATION_BUCKET}

[gcp]
gcp_asset_storage_bucket = ${APPLICATION_BUCKET}

[hermes]
url=${HERMES_URL}

[floware]
service_url = ${FLOWARE_SERVICE_URL}

[database]
username = ${DB_USERNAME}
password = ${DB_PASSWORD}
host = ${DB_HOST}
port = ${DB_PORT}
db_name = ${DB_NAME}
pool_size = ${DB_POOL_SIZE:20}
max_overflow = ${DB_MAX_OVERFLOW:20}
pool_timeout = ${DB_POOL_TIMEOUT:30}
pool_recycle = ${DB_POOL_RECYCLE:1800}
