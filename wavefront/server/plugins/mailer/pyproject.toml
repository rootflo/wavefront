[project]
name = "mailer"
version = "0.1.0"
description = "Email provider plugin — OAuth, send and read for Gmail and Outlook mailboxes"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.25.0",
    "msal>=1.28.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "google-cloud-pubsub>=2.21.0",
    "beautifulsoup4>=4.8.0,<4.9.dev0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailer"]
