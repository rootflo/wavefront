[project]
name = "authenticator"
version = "0.1.0"
description = "Authenticator plugin"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.25.0",
    "pyjwt[crypto]>=2.9.0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["authenticator"]
