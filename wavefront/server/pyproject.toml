[project]
name = "wavefront"
version = "0.1.0"
description = "Monorepo backend for wavefront apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ty>=0.0.1a28",
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "flo-testing",
]

[tool.ty.environment]
root = ["../server"]

[tool.uv.workspace]
members = [
 "apps/*",
 "modules/*",
 "misc/*",
 "packages/*",
 "plugins/*",
 "background_jobs/*"
]

[tool.uv]
required-version = ">=0.7.3"
override-dependencies = [
    "torch>=2.6.0 ; sys_platform != 'darwin'",
    # redshift-connector >=2.1.14 (fixes an eval() RCE in its vector_in result
    # handler) needs beautifulsoup4 >=4.13.5, but abandoned textract 1.6.5 caps
    # it at <4.9. textract only touches bs4 in its epub/html parsers; we call it
    # solely as process(pdf, method='pdfminer'), so that cap is inert for us.
    "beautifulsoup4>=4.13.5,<5.0.0",
]

# Security floors for packages that mostly arrive indirectly -- via flo-ai,
# pipecat-ai, twilio, fastapi[all] and the azure-* SDKs. Constraints rather than
# overrides: a constraint intersects with what upstream declares and fails the
# resolve if that intersection is empty, where an override would silently defeat
# a real cap.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "authlib>=1.6.12",
    "azure-core>=1.38.0",
    "click>=8.3.3",
    "ecdsa>=0.19.2",
    "filelock>=3.20.3",
    "google-cloud-aiplatform>=1.131.0",
    "h2>=4.4.1",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "mako>=1.3.12",
    "microsoft-kiota-http>=1.9.9",
    "nltk>=3.10.3",
    "orjson>=3.11.6",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "ujson>=5.13.0",
    "urllib3>=2.7.0",
    "virtualenv>=20.36.1",
]

# No workspace member currently runs torch/torchvision on GPU nodes
# (inference_use_gpu and equivalents are false in every deployed environment;
# gold-weight-ratio's GPU service lives in a separate repo/image) — CPU-only
# wheels avoid pulling ~2GB of unused nvidia-*-cu12 CUDA libraries into images.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
flo-testing = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Single source of truth for the whole workspace: `pytest` from server/ runs
# every suite. Per-module [tool.pytest.ini_options] blocks were removed, since
# they only ever took effect when pytest was invoked from inside that module and
# silently diverged from each other.
#
# The `db` marker and the APP_ENV/SUPERSET_FLAG defaults live in the flo-testing
# plugin rather than here, so they travel with the harness.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
testpaths = ["apps", "modules", "packages", "plugins"]
