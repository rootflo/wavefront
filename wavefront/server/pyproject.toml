[project]
name = "wavefront"
version = "0.1.0"
description = "Monorepo backend for wavefront apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ty>=0.0.1a28",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "flo-testing",
]

[tool.ty.environment]
root = ["../server"]

[tool.uv.workspace]
members = [
 "apps/*",
 "modules/*",
 "misc/*",
 "packages/*",
 "plugins/*",
 "background_jobs/*"
]

[tool.uv]
required-version = ">=0.9.17"

# Dependency cooldown: ignore releases younger than this when resolving, so a
# compromised or broken upload has a window to be spotted before it can enter
# the lock. Applies at resolve time only -- `uv sync --frozen` in the service
# images installs exactly what the lock already pins, so this never delays a
# deploy. Needs uv >= 0.9.17 for the duration form, hence required-version.
exclude-newer = "7 days"

# flo-ai is our own package, published from this repo -- a cooldown meant to
# catch a compromised third-party upload buys nothing there, and an exact pin
# on a fresh release would otherwise make the workspace unresolvable.
exclude-newer-package = { flo-ai = "0 days" }

override-dependencies = [
    # redshift-connector >=2.1.14 (fixes an eval() RCE in its vector_in result
    # handler) needs beautifulsoup4 >=4.13.5, but abandoned textract 1.6.5 caps
    # it at <4.9. textract only touches bs4 in its epub/html parsers; we call it
    # solely as process(pdf, method='pdfminer'), so that cap is inert for us.
    "beautifulsoup4>=4.13.5,<5.0.0",
    # Same shape of problem: textract caps xlrd at ~=1.2.0, but flo-ai
    # needs xlrd 2.x to read legacy .xls uploads (1.2.0's xlsx support was
    # dropped in 2.0 precisely because it was unreliable). textract imports xlrd
    # only from its xls/xlsx parsers, and parsers/__init__.py resolves a parser
    # lazily by extension via importlib -- on the PDF path it is never imported.
    "xlrd>=2.0.1,<3.0.0",
    # textract also pins pdfminer.six==20191110 (CVE-2025-64512, CVE-2025-70559).
    # It only shells out to the pdf2txt.py script that newer releases still ship.
    "pdfminer.six>=20251107",
    # presidio-anonymizer (via flo-ai[guardrails]) pins cryptography <49, but
    # 48.x has CVE-2026-69247/69248/69249. presidio only uses it for the AES
    # encrypt/decrypt operators (Cipher/AES/CBC, padding), unchanged in 50.x.
    "cryptography>=50.0.0",
    # Pipecat 1.12 wants onnxruntime~=1.24.3, which dropped Intel macOS wheels.
    "onnxruntime==1.23.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime~=1.24.3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # pipecat-ai 1.12 caps Pillow <13, but 12.x has CVE-2026-112393 and ~40 more
    # fixed only in 13.0.0. pipecat only uses Image.open/frombytes/resize/save
    # for image frames, unchanged in 13.
    "pillow>=13.0.0,<14",
]

# Security floors for packages that mostly arrive indirectly -- via flo-ai,
# pipecat-ai, twilio, fastapi[all] and the azure-* SDKs. Constraints rather than
# overrides: a constraint intersects with what upstream declares and fails the
# resolve if that intersection is empty, where an override would silently defeat
# a real cap.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "authlib>=1.9.1",
    "azure-core>=1.38.0",
    "certifi>=2026.10.18",
    "click>=8.3.3",
    "dnspython>=2.9.0",
    "ecdsa>=0.19.2",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "google-cloud-aiplatform>=1.131.0",
    # google-auth deprecates grpcio < 1.83 (no post-quantum TLS) and will
    # require it from October 2026.
    "grpcio>=1.83.0",
    "h2>=4.4.1",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "mako>=1.4.2",
    "microsoft-kiota-http>=1.9.9",
    "nltk>=3.10.3",
    "orjson>=3.11.6",
    # protobuf 5.x has CVE-2026-0994. Moves grpcio-status off 1.71.x, which
    # caps protobuf<6.
    "protobuf>=6.31.1",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=84.1.0",
    # Forces FastAPI off 0.115.6, which caps starlette<0.42.0 and so pinned us to
    # starlette 0.41.3 and its seven advisories (CVE-2026-54282 and six more).
    # FastAPI is the only thing in the graph that depends on starlette, so this
    # constraint is what moves it; the app manifests already allow fastapi<1.0.0,
    # and pipecat-ai's runner/websocket extras ask for fastapi<1,>=0.115.6, so
    # the resolver is free to take a release that permits starlette 1.x.
    "starlette>=1.3.1",
    "ujson>=5.13.0",
    "transformers>=5.5.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.12",
]


# torch runs on CPU everywhere, inference_app included, so every platform
# (macOS dev machines too) installs the CPU-only wheels; this keeps ~2GB of
# nvidia-*-cu12 CUDA libraries out of images.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
flo-testing = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
testpaths = ["apps", "background_jobs", "modules", "packages", "plugins"]
