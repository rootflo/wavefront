[project]
name = "wavefront"
version = "0.1.0"
description = "Monorepo backend for wavefront apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ty>=0.0.1a28",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "flo-testing",
]

[tool.ty.environment]
root = ["../server"]

[tool.uv.workspace]
members = [
 "apps/*",
 "modules/*",
 "misc/*",
 "packages/*",
 "plugins/*",
 "background_jobs/*"
]

[tool.uv]
required-version = ">=0.9.17"

# Dependency cooldown: ignore releases younger than this when resolving, so a
# compromised or broken upload has a window to be spotted before it can enter
# the lock. Applies at resolve time only -- `uv sync --frozen` in the service
# images installs exactly what the lock already pins, so this never delays a
# deploy. Needs uv >= 0.9.17 for the duration form, hence required-version.
exclude-newer = "7 days"

# flo-ai is our own package, published from this repo -- a cooldown meant to
# catch a compromised third-party upload buys nothing there, and an exact pin
# on a fresh release would otherwise make the workspace unresolvable.
exclude-newer-package = { flo-ai = "0 days" }

override-dependencies = [
    "torch>=2.6.0 ; sys_platform != 'darwin'",
    # redshift-connector >=2.1.14 (fixes an eval() RCE in its vector_in result
    # handler) needs beautifulsoup4 >=4.13.5, but abandoned textract 1.6.5 caps
    # it at <4.9. textract only touches bs4 in its epub/html parsers; we call it
    # solely as process(pdf, method='pdfminer'), so that cap is inert for us.
    "beautifulsoup4>=4.13.5,<5.0.0",
    # Same shape of problem: textract caps xlrd at ~=1.2.0, but agents-module
    # needs xlrd 2.x to read legacy .xls uploads (1.2.0's xlsx support was
    # dropped in 2.0 precisely because it was unreliable). textract imports xlrd
    # only from its xls/xlsx parsers, and parsers/__init__.py resolves a parser
    # lazily by extension via importlib -- on the PDF path it is never imported.
    "xlrd>=2.0.1,<3.0.0",
]

# Security floors for packages that mostly arrive indirectly -- via flo-ai,
# pipecat-ai, twilio, fastapi[all] and the azure-* SDKs. Constraints rather than
# overrides: a constraint intersects with what upstream declares and fails the
# resolve if that intersection is empty, where an override would silently defeat
# a real cap.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "authlib>=1.6.12",
    "azure-core>=1.38.0",
    "click>=8.3.3",
    "ecdsa>=0.19.2",
    "filelock>=3.20.3",
    "google-cloud-aiplatform>=1.131.0",
    "h2>=4.4.1",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "mako>=1.3.12",
    "microsoft-kiota-http>=1.9.9",
    "nltk>=3.10.3",
    "orjson>=3.11.6",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    # Forces FastAPI off 0.115.6, which caps starlette<0.42.0 and so pinned us to
    # starlette 0.41.3 and its seven advisories (CVE-2026-54282 and six more).
    # FastAPI is the only thing in the graph that depends on starlette, so this
    # constraint is what moves it; the app manifests already allow fastapi<1.0.0,
    # and pipecat-ai's runner/websocket extras ask for fastapi<1,>=0.115.6, so
    # the resolver is free to take a release that permits starlette 1.x.
    "starlette>=1.3.1",
    "ujson>=5.13.0",
    "urllib3>=2.7.0",
    "virtualenv>=20.36.1",
]


[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
flo-testing = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
testpaths = ["apps", "modules", "packages", "plugins"]
