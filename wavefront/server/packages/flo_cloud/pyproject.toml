[project]
name = "flo-cloud"
version = "0.1.0"
description = "Cloud service helper functions for flo apps"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17.0",
    "azure-keyvault-keys>=4.9.0",
    "azure-storage-blob>=12.20.0",
    "azure-storage-queue>=12.10.0",
    "boto3>=1.42.22,<2.0.0",
    "cryptography>=46.0.5",
    "google-cloud-bigquery==3.34.0",
    "google-cloud-kms>=3.5.1",
    "google-cloud-storage<3.0.0",
    "google-cloud-pubsub>=2.28.0",
    "redshift-connector>=2.1.14",
    "mssql-python",
    "psycopg2-binary>=2.9.10,<3.0.0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flo_cloud"]
