[project]
name = "flo-utils"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.5",
    "flo-cloud",
    "tiktoken>=0.9.0",
]

[tool.uv.sources]
flo-cloud = { workspace = true }

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flo_utils"]
