[project]
name = "flo-utils"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.22,<2.0.0",
    "google-cloud-kms>=3.5.1",
    "tenacity>=8.4.1",
    "common-module",
    "db-repo-module",
    "pyyaml>=6.0.3,<7"
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flo_utils"]
