[project]
name = "flo-testing"
version = "0.1.0"
description = "Shared pytest harness for the wavefront server workspace"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
readme = "README.md"
requires-python = ">=3.11"

# Deliberately light. The harness reaches into db_repo_module, common_module,
# auth_module and user_management_module, but it imports them lazily inside the
# fixtures rather than declaring them here: those modules depend on flo-testing
# from their own dev groups, and declaring the reverse edge would make the
# workspace graph circular.
dependencies = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "testing-postgresql>=1.3.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0",
    "fastapi>=0.115.2,<1.0.0",
    "httpx>=0.27.0",
    "dependency-injector>=4.42.0,<5.0.0",
]

# Registering as a pytest plugin is what lets a module pick up the whole harness
# by adding one dev dependency, with no conftest to copy.
[project.entry-points.pytest11]
flo_testing = "flo_testing.plugin"

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flo_testing"]
