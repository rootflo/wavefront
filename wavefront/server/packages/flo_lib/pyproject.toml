[project]
name = "flo-lib"
version = "0.1.0"
description = "Shared libraries for wavefront (HTTP and future utilities)"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13.1",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flo_lib"]
