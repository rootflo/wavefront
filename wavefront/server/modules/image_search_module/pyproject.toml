[project]
name = "image-search-module"
version = "0.1.0"
description = "Generic image search and matching module"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "flo-cloud",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }
flo-cloud = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-mock>=3.12.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_search_module"]
