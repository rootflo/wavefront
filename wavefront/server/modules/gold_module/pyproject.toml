[project]
name = "gold-module"
version = "0.1.0"
description = ""
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "dependency-injector>=4.42.0,<5.0.0",
    "fastapi>=0.115.2,<1.0.0",
    "google-cloud-storage<3.0.0",
    "google-cloud-pubsub>=2.29.0,<3.0.0",
    "azure-identity>=1.17.0,<2.0.0",
    "azure-storage-blob>=12.20.0,<13.0.0",
    "azure-storage-queue>=12.10.0,<13.0.0",
]

[tool.uv.sources]
common-module = { workspace = true }

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold_module"]
