[project]
name = "triggers-module"
version = "0.1.0"
description = "Agentic triggers module — external events fire v3 inference"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "agents-module",
    "flo-cloud",
    "flo-utils",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "google-cloud-pubsub>=2.21.0",
    "beautifulsoup4>=4.8.0,<4.9.dev0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "dependency-injector>=4.41.0",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }
agents-module = { workspace = true }
flo-cloud = { workspace = true }
flo-utils = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triggers_module"]
