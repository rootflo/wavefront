[project]
name = "triggers-module"
version = "0.1.0"
description = "Agentic triggers module — external events fire v3 inference"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "agents-module",
    "flo-cloud",
    "flo-utils",
    "mailer",
    "plugins-module",
    "user-management-module",
    "beautifulsoup4>=4.13.5,<5.0.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "dependency-injector>=4.41.0",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }
agents-module = { workspace = true }
flo-cloud = { workspace = true }
flo-utils = { workspace = true }
mailer = { workspace = true }
plugins-module = { workspace = true }
user-management-module = { workspace = true }

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triggers_module"]
