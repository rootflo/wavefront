[project]
name = "knowledge-base-module"
version = "0.1.0"
description = ""
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "datasource",
    "flo-cloud",
    "pydantic>=2.11.3,<3.0.0",
    "pymupdf>=1.25.5,<2.0.0",
    "tiktoken~=0.9.0",
    "numpy>=1.24,<2.0",
    "pandas~=2.2.3",
    "ollama~=0.4.8",
    "textract~=1.6.5",
    "flo-ai==1.1.11",
    "google-cloud-pubsub~=2.30.0",
    "boto3>=1.42.22,<2.0.0",
    "pyyaml>=6.0.3,<7",
    "flo-cloud",
    "python-multipart",
]

[tool.uv.sources]
flo-testing = { workspace = true }
flo-cloud = { workspace = true }
auth-module = { workspace = true }
common-module = { workspace = true }
db-repo-module = { workspace = true }
user-management-module = { workspace = true }
datasource = { workspace = true }

[dependency-groups]
dev = [
    "flo-testing",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "auth-module",
    "common-module",
    "db-repo-module",
    "user-management-module",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_base_module"]
