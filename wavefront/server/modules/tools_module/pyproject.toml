[project]
name = "tools_module"
version = "0.1.0"
description = "Tools module for Flo AI agent system"
dependencies = [
    "flo-ai==1.1.8",
    "flo_cloud",

    "datasource",
    "common_module",
    "plugins-module",
    "knowledge-base-module"
]

[tool.uv.sources]
# Pinned to a custom flo-ai branch (ForEach forward_all_results / subworkflow
# references) until it's published to PyPI. uv.lock resolves the branch to a
# commit SHA; the Docker build fetches it over git (no local source needed).
flo-ai = { git = "https://github.com/rootflo/flo-ai.git", subdirectory = "flo_ai", branch = "CU-86d3v9qck-make-functionnodes-receive-vars-msgs-carry-their-producing-node" }
flo-cloud = { workspace = true }
common-module = { workspace = true }
plugins-module = { workspace = true }
datasource = { workspace = true }
knowledge-base-module = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools_module"]
