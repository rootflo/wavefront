[project]
name = "tools_module"
version = "0.1.0"
description = "Tools module for Flo AI agent system"
dependencies = [
    "flo-ai==1.1.11",
    "httpx>=0.27.0,<1.0.0",
    "flo_cloud",

    "datasource",
    "common_module",
    "plugins-module",
    "knowledge-base-module"
]

[tool.uv.sources]
flo-cloud = { workspace = true }
common-module = { workspace = true }
plugins-module = { workspace = true }
datasource = { workspace = true }
knowledge-base-module = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools_module"]
