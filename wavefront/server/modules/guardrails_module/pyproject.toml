[project]
name = "guardrails-module"
version = "0.1.0"
description = "AI guardrail policy management for Wavefront"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "flo-ai[guardrails]==1.1.12",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "dependency-injector>=4.40.0",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails_module"]
