[project]
name = "guardrails-module"
version = "0.1.0"
description = "AI guardrail policy management for Wavefront"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "flo-ai[guardrails]==1.1.11",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "dependency-injector>=4.40.0",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails_module"]
