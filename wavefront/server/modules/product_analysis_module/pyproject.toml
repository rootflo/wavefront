[project]
name = "product-analysis-module"
version = "0.1.0"
description = ""
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]

requires-python = ">=3.11"
dependencies = [
    "common-module",
    "db-repo-module",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "flo-testing",
]

[tool.uv.sources]
flo-testing = { workspace = true }
common-module = { workspace = true }
db-repo-module = { workspace = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hatch.build.targets.wheel]
packages = ["product_analysis_module"]
