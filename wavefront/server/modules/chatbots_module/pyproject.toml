[project]
name = "chatbots-module"
version = "0.1.0"
description = "Text chatbots with persistent chat sessions"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "db-repo-module",
    "llm-inference-config-module",
    "user-management-module",
    "flo-ai==1.1.13",
]

[tool.uv.sources]
common-module = { workspace = true }
db-repo-module = { workspace = true }
llm-inference-config-module = { workspace = true }
user-management-module = { workspace = true }

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatbots_module"]
