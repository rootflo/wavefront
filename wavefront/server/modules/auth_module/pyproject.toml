[project]
name = "auth-module"
version = "0.0.1"
description = "Authentication module"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "flo-cloud",
    "dependency-injector>=4.42.0,<5.0.0",
    "msgraph-sdk>=1.5.4,<2.0.0",
    "pyjwt[crypto]>=2.9.0",
]

[tool.uv.sources]
flo-testing = { workspace = true }
common-module = { workspace = true }
flo-cloud = { workspace = true }

[dependency-groups]
dev = [
    "flo-testing",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0"
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth_module"]
