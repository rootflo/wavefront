[project]
name = "agents-module"
version = "0.1.0"
description = "Agents module for inference"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "flo-cloud",
    "flo-utils",
    "tools-module",
    "api-services-module",
    "llm-inference-config-module",
    "flo-ai==1.1.12",
    "celery[redis]>=5.4.0,<6.0.0",
    "pillow>=11.0.0",
    "pymupdf>=1.25.5,<2.0.0",
]

[tool.uv.sources]
common-module = { workspace = true }
flo-utils = { workspace = true }
flo-cloud = { workspace = true }
tools-module = {workspace = true}
api-services-module = {workspace = true}
llm-inference-config-module = {workspace = true}

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_module"]
