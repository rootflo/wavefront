[project]
name = "agents-module"
version = "0.1.0"
description = "Agents module for inference"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "common-module",
    "flo-cloud",
    "flo-utils",
    "tools-module",
    "api-services-module",
    "llm-inference-config-module",
    "flo-ai==1.1.7",
    "celery[redis]>=5.4.0,<6.0.0",
]

[tool.uv.sources]
# Pinned to a custom flo-ai branch (ForEach forward_all_results / subworkflow
# references) until it's published to PyPI. uv.lock resolves the branch to a
# commit SHA; the Docker build fetches it over git (no local source needed).
flo-ai = { git = "https://github.com/rootflo/flo-ai.git", subdirectory = "flo_ai", branch = "CU-86d3rqjgt-support-subworkflow-references-foreachnode-forwardallresults-bool" }
common-module = { workspace = true }
flo-utils = { workspace = true }
flo-cloud = { workspace = true }
tools-module = {workspace = true}
api-services-module = {workspace = true}
llm-inference-config-module = {workspace = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_module"]
