[project]
name = "user-management-module"
version = "0.0.1"
description = "User Management Module"
authors = [
    { name = "rootflo engineering", email = "engineering@rootflo.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "auth-module",
    "db-repo-module",

    "pydantic[email]>=2.9.2,<3.0.0",
    "dependency-injector>=4.42.0,<5.0.0",
    "fastapi>=0.115.2,<1.0.0",
    "authlib>=1.3.2,<2.0.0",
    "bcrypt>=4.2.1,<5.0.0",
]

[tool.uv.sources]
flo-testing = { workspace = true }
auth-module = { workspace = true }
db-repo-module = { workspace = true }

[dependency-groups]
dev = [
    "flo-testing",
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "asyncpg>=0.30.0,<1.0.0",
]

[tool.uv]
package = true
# Inert here: uv reads resolver settings only from the workspace root
# (wavefront/server/pyproject.toml), which is where the real cooldown lives.
# Kept so the setting survives if this package is ever split out.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["user_management_module"]
