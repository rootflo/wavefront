name: Security Report

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat_git_report_workflow'

jobs:
  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript"
          upload: false # Keep local for the generator to find

      # Specific setup for PCStefan action
      - name: "Install browser via puppeteer"
        run: npx puppeteer@23.1.1 browsers install chrome

      - name: "Generate Security Report"
        uses: PCStefan/github-security-report-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # sarifReportDir defaults to ../results which is where CodeQL outputs
          outputFilename: summary.pdf

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: summary.pdf
          if-no-files-found: error