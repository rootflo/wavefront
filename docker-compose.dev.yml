version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=floware
    ports:
      - '5432:5432'
    volumes:
      - /var/lib/postgres-data:/var/lib/postgresql/data
      - /var/lib/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - floware-network

  # Celery broker and floware cache. noeviction so queued tasks are never evicted.
  redis:
    image: redis:7.4
    container_name: redis
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - noeviction
      - --maxmemory-clients
      - ${REDIS_MAXMEMORY_CLIENTS:-5%}
    ports:
      - "6379:6379"
    networks:
      - floware-network

volumes:
  db:
    driver: local

networks:
  floware-network:
    driver: bridge
